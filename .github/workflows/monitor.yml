name: Netra Attendance Monitor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Netra attendance monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NETRA_ACCESS_TOKEN: ${{ secrets.NETRA_ACCESS_TOKEN }}
        run: python monitor.py

      - name: Save attendance state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add attendance_state.json

          if git diff --cached --quiet; then
            echo "No state change to commit."
            exit 0
          fi

          git commit -m "Update attendance monitoring state"

          git pull --rebase origin main

          git push origin HEAD:main
